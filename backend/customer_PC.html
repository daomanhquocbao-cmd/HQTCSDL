<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tổng quan - Film Hub (PC)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9f1fb; --card:#fff; --ink:#0f1f33; --mute:#6b7c93; --line:#e6edf6;
  --blue:#0b7bbd; --blue2:#065a95; --green:#1fb85a; --orange:#e8830c; --soft:#eaf4fc;
  --amber-bg:#fff1cc; --amber:#c77700; --ok-bg:#dcf7e6; --ok:#12924a; --shadow:0 6px 20px rgba(11,80,140,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1624; --card:#142235; --ink:#eaf2fb; --mute:#8fa3bb; --line:#223650; --soft:#1a2e47;
  --amber-bg:#3a2d10; --amber:#f5b84a; --ok-bg:#12341f; --ok:#4bd283; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0c1624; --card:#142235; --ink:#eaf2fb; --mute:#8fa3bb; --line:#223650; --soft:#1a2e47;
  --amber-bg:#3a2d10; --amber:#f5b84a; --ok-bg:#12341f; --ok:#4bd283; --shadow:none;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--card);padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;box-shadow:1px 0 0 var(--line)}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;font-size:22px}
.brand b{font-size:17px;display:block;font-weight:800}
.side button{display:flex;gap:12px;align-items:center;width:100%;padding:13px 14px;border-radius:14px;font-weight:600;font-size:15px;color:var(--mute);margin-bottom:6px;text-align:left}
.side button.on{background:var(--soft);color:var(--blue)}
.side button:hover:not(.on){background:var(--bg)}
.side .sp{flex:1}
main{min-width:0}
.top{display:flex;align-items:center;gap:16px;padding:22px 32px;background:var(--card);box-shadow:0 1px 0 var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.top .search{flex:1;max-width:420px;margin-left:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:14px;padding:0 14px}
.search input{flex:1;border:0;background:none;padding:12px 0;font:inherit;color:var(--ink);outline:0}
.ic{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:18px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-weight:800}
.who b{display:block;font-size:14px}.who span{font-size:11.5px;color:var(--mute);font-weight:600}
.content{padding:28px 32px 56px;max-width:1500px}
.card{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.card h2{font-size:15px;font-weight:800;margin-bottom:14px}
.mute{color:var(--mute);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}.sp-b{justify-content:space-between}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.g2{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;margin-top:20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.stat .lbl{font-size:12.5px;font-weight:700;color:var(--mute);letter-spacing:.3px}
.stat .num{font-size:32px;font-weight:800;margin:8px 0 4px}
.stat.hero{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.stat.hero .lbl,.stat.hero .mute{color:rgba(255,255,255,.82)}
.stat.hero .num{font-size:22px}
.chip{display:inline-flex;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--blue)}
.chip.pend{background:var(--amber-bg);color:var(--amber)}.chip.ok{background:var(--ok-bg);color:var(--ok)}
.btn{display:inline-block;padding:12px 22px;border-radius:13px;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;text-align:center}
.btn.w{width:100%;padding:15px}.btn.sm{padding:8px 14px;font-size:13px;border-radius:11px}
.btn.ghost{background:var(--card);color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.white{background:#fff;color:var(--blue2)}
.link{color:var(--blue);font-weight:600;font-size:13px;padding:7px 12px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line)}
.cover{height:150px;border-radius:16px;display:grid;place-items:center;font-size:52px;position:relative}
.cover .tag{position:absolute;left:12px;top:12px;font-size:11.5px;background:rgba(255,255,255,.93);color:#0f1f33;padding:4px 10px;border-radius:99px;font-weight:700}
.rc{padding:12px;text-align:left;width:100%;transition:transform .15s}.rc:hover{transform:translateY(-3px)}
.rc h3{font-size:15.5px;font-weight:700;margin:12px 2px 2px}
.price{font-weight:800;color:var(--blue)}
.chart{display:flex;align-items:flex-end;gap:26px;height:210px;padding:0 12px;border-bottom:1px dashed var(--line)}
.chart div{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart i{display:block;width:100%;max-width:80px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,var(--blue),var(--blue2))}
.chart i.now{background:linear-gradient(180deg,#2bd070,var(--green))}
.chart b{font-size:12px;margin-bottom:6px}
.xl{display:flex;gap:26px;padding:8px 12px 0}.xl span{flex:1;text-align:center;font-weight:700;font-size:12.5px}
.li{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.li .grow{flex:1;min-width:0}.li b{display:block}
.ph{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:30px}
.tabs{display:inline-flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow)}
.tabs button{padding:9px 20px;border-radius:11px;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--blue);color:#fff}
.pill{padding:9px 16px;border-radius:99px;background:var(--card);font-weight:600;box-shadow:var(--shadow);margin-right:8px}
.pill.on{background:var(--blue);color:#fff}
.dl{display:grid;grid-template-columns:1fr 400px;gap:24px;align-items:start}
.spec{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.spec div{background:var(--soft);border-radius:14px;padding:12px}.spec b{display:block;font-size:13.5px;margin-top:2px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--card);margin-bottom:10px;width:100%;text-align:left;box-shadow:inset 0 0 0 1.5px var(--line)}
.opt.on{box-shadow:inset 0 0 0 2px var(--blue);background:var(--soft)}
.opt .grow{flex:1}.opt b{display:block}
.panel{position:sticky;top:104px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 16px}
.day{padding:8px 0;border-radius:12px;background:var(--bg);text-align:center}
.day b{display:block;font-size:15px}.day span{font-size:11px;color:var(--mute)}
.day.on{background:var(--blue);color:#fff}.day.on span{color:#dff0fb}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:9px 0;border-radius:11px;background:var(--card);font-weight:600;font-size:13px;box-shadow:inset 0 0 0 1.5px var(--line)}
.slot.on{background:var(--blue);color:#fff;box-shadow:none}.slot.rng{background:var(--soft);color:var(--blue);box-shadow:none}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.step{display:flex;align-items:center;gap:12px}
.step button{width:32px;height:32px;border-radius:10px;background:var(--soft);color:var(--blue);font-weight:800;font-size:18px}
.total{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
.total .price{font-size:24px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--mute);padding:0 12px 10px}
.tbl td{padding:14px 12px;border-top:1px solid var(--line)}
.ov{position:fixed;inset:0;background:rgba(8,20,36,.55);z-index:30;display:grid;place-items:center}
.sheet{width:min(420px,92vw);background:var(--card);border-radius:24px;padding:26px;max-height:88vh;overflow:auto}
.qr{display:grid;grid-template-columns:repeat(11,1fr);width:200px;aspect-ratio:1;margin:16px auto;padding:10px;background:#fff;border-radius:14px}
.qr i{background:#fff}.qr i.k{background:#0f1f33}
.ai{position:fixed;right:28px;bottom:24px;z-index:20;width:360px}
.aibtn{float:right;padding:13px 20px;border-radius:99px;background:linear-gradient(135deg,var(--green),#0e9a47);color:#fff;font-weight:700;box-shadow:0 8px 20px rgba(31,184,90,.4)}
.aibox{background:var(--card);border-radius:20px;box-shadow:0 12px 40px rgba(8,30,60,.25);padding:16px;margin-bottom:12px;clear:both}
.msg{max-width:88%;padding:9px 13px;border-radius:15px;margin-bottom:8px;line-height:1.45;font-size:13.5px}
.msg.ai{background:var(--soft)}.msg.me{background:var(--blue);color:#fff;margin-left:auto}
.stars button{font-size:30px;filter:grayscale(1);opacity:.45}.stars button.on{filter:none;opacity:1}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:50;font-weight:600}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(max-width:1100px){.shell{grid-template-columns:76px 1fr}.brand div:last-child,.side button span:last-child{display:none}.side button{justify-content:center}.g4{grid-template-columns:1fr 1fr}.g2,.dl{grid-template-columns:1fr}.panel{position:static}.who{display:none}}
</style>
</head>
<body>
<div class="shell">
 <aside>
  <div class="brand"><div class="logo">🎞️</div><div><b>Film Hub</b><span class="mute">Film Photography</span></div></div>
  <nav class="side" id="side"></nav>
 </aside>
 <main>
  <header class="top"><h1 id="title"></h1>
   <label class="search"><span>🔍</span><input id="gq" placeholder="Tìm phòng chụp, phòng tối, thiết bị…"></label>
   <button class="ic" data-a="theme" aria-label="Đổi giao diện">🌓</button>
   <div class="row"><div class="avatar">K7</div><div class="who"><b>Khách hàng số 7</b><span>PHOTOGRAPHER</span></div></div>
  </header>
  <div class="content" id="view"></div>
 </main>
</div>
<div id="ai" class="ai"></div>
<script>
const $=s=>document.querySelector(s);
const money=n=>n.toLocaleString('vi-VN')+' đ';
const C={green:['#1fb85a','#0e8a43'],blue:['#0b7bbd','#065a95'],orange:['#f2a03d','#e8830c']};
const ROOMS=[
 {id:1,name:'Phòng chụp Vintage',type:'studio',kind:'Studio chụp ảnh',rate:270000,rating:4.6,n:5,c:'green',e:'🎞️',area:'35 m²',cap:'6 người',light:'Ánh sáng ấm, cửa sổ lớn',hours:'08:00 – 21:00',addr:'Quận 3, TP.HCM',style:'Vintage',
  eq:[['Máy Nikon FM2 + 50mm',120000],['Đèn nền tungsten x2',60000],['Phông vải retro',40000]],
  pk:[['Chân dung phim 2h','Phông retro + 1 cuộn Portra 400',180000],['Chụp sản phẩm','Bàn chụp + đèn softbox',140000]]},
 {id:2,name:'Phòng chụp Minimal',type:'studio',kind:'Studio chụp ảnh',rate:240000,rating:4.2,n:3,c:'orange',e:'📸',area:'28 m²',cap:'4 người',light:'Ánh sáng trắng, nền cyclorama',hours:'09:00 – 20:00',addr:'Quận 1, TP.HCM',style:'Minimal',
  eq:[['Máy Pentax K1000',100000],['Softbox 90cm',50000],['Giá 3 chân',20000]],
  pk:[['Lookbook tối giản','Nền trắng + 2 đèn',160000]]},
 {id:3,name:'Phòng tối B&W',type:'dark',kind:'Phòng tối (Darkroom)',rate:200000,rating:4.5,n:2,c:'blue',e:'🧪',area:'18 m²',cap:'3 người',light:'Đèn an toàn đỏ, thông gió tốt',hours:'08:00 – 20:00',addr:'Quận Phú Nhuận, TP.HCM',style:'Đen trắng',
  eq:[['Máy phóng ảnh Durst',90000],['Bộ hóa chất B&W',70000],['Giấy ảnh Ilford x10',110000]],
  pk:[['Tráng phim cơ bản','Hướng dẫn 1-1 + hóa chất',150000],['In tay B&W','Phóng 8 ảnh 8x10',220000]]}
];
const POSTS=[['Cách bảo quản phim sau khi chụp','Chuyên gia Minh Quân','Kỹ thuật','📚'],['Review Pentax K1000 sau 1 năm dùng','Hà Thu','Đánh giá máy','📷'],['Tráng phim đen trắng tại nhà: 7 lỗi hay gặp','Chuyên gia Tuấn Anh','Phòng tối','🧪']];
const WS=[['Workshop in ảnh phòng tối cho người mới','22/11/2026 · 14:00','Phòng tối B&W','8/12 chỗ'],['Chụp chân dung ánh sáng tự nhiên với phim','29/11/2026 · 09:00','Phòng chụp Vintage','5/10 chỗ']];
const TITLES={home:'Tổng quan',explore:'Khám phá',bookings:'Lịch đặt của tôi',community:'Cộng đồng',profile:'Hồ sơ & Bộ sưu tập'};
const NAV=[['home','📊','Tổng quan'],['explore','🔍','Khám phá'],['bookings','🗓️','Lịch đặt'],['community','👥','Cộng đồng'],['profile','👤','Hồ sơ']];
const S={tab:'home',room:null,q:'',f:'all',bk:'up',com:'post',date:0,start:null,dur:2,eq:new Set(),pkg:null,pay:'VNPay',aiOpen:false,
 bookings:[
  {id:'FH-1118-0187',room:1,date:'18/11/2026',t:'09:00 – 12:00',st:'ok',total:810000},
  {id:'FH-1112-0143',room:3,date:'12/11/2026',t:'14:00 – 17:00',st:'done',total:600000,rated:0},
  {id:'FH-1103-0098',room:2,date:'03/11/2026',t:'10:00 – 12:00',st:'done',total:480000,rated:5}],
 chat:[['ai','Chào bạn! Mình là trợ lý AI. Bạn muốn tìm phòng, chọn thiết bị hay hỏi kỹ thuật chụp phim?']]};
const room=id=>ROOMS.find(r=>r.id==id);
const cover=r=>`<div class="cover" style="background:linear-gradient(135deg,${C[r.c][0]},${C[r.c][1]})">${r.e}<span class="tag">${r.style}</span></div>`;
const roomCard=r=>`<button class="card rc" data-a="open" data-id="${r.id}">${cover(r)}<h3>${r.name}</h3><div class="mute">${r.kind} · ${r.addr}</div><div class="row sp-b" style="margin-top:8px"><span class="price">${money(r.rate)}/giờ</span><span class="mute">⭐ ${r.rating} (${r.n})</span></div></button>`;
const stChip=s=>s=='ok'?'<span class="chip ok">Đã duyệt</span>':s=='pend'?'<span class="chip pend">Chờ duyệt</span>':'<span class="chip">Hoàn thành</span>';
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2400)};
const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d});
const fd=d=>d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});
const hours=[...Array(12)].map((_,i)=>8+i);
const taken=(r,di,h)=>((r.id*7+di*5+h*3)%9===0);
const hh=h=>String(h).padStart(2,'0')+':00';
function qrHtml(code){let s=0;for(const ch of code)s=(s*31+ch.charCodeAt(0))>>>0;let o='';
 const fin=(x,y)=>x==0||x==2||y==0||y==2||(x==1&&y==1);
 for(let y=0;y<11;y++)for(let x=0;x<11;x++){const f=(x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7);let k;
  if(f)k=fin(x>7?x-8:x,y>7?y-8:y);else{s=(s*1103515245+12345)>>>0;k=(s>>>16)%2==0}
  o+=`<i class="${k?'k':''}"></i>`}
 return `<div class="qr">${o}</div>`}

function home(){
 const up=S.bookings.filter(b=>b.st!='done'),nx=up[0],done=S.bookings.filter(b=>b.st=='done');
 const spent=S.bookings.reduce((a,b)=>a+b.total,0);
 const hist=[0.9,1.4,1.1,1.8,1.6,+(spent/1e6).toFixed(2)],mx=Math.max(...hist),L=['T6','T7','T8','T9','T10','T11'];
 const rated=done.filter(b=>b.rated);
 return `<div class="g4">
  <div class="card stat hero"><div class="lbl">LỊCH SẮP TỚI</div>${nx?`<div class="num">${room(nx.room).name}</div><div class="mute">${nx.date} · ${nx.t}</div>${nx.st=='ok'?`<button class="btn sm white" style="margin-top:12px" data-a="qr" data-id="${nx.id}">Hiện mã QR check-in</button>`:'<div class="mute" style="margin-top:12px">Đang chờ nhà cung cấp duyệt</div>'}`:`<div class="num">Chưa có</div><button class="btn sm white" style="margin-top:12px" data-a="tab" data-id="explore">Đặt phòng ngay</button>`}</div>
  <div class="card stat"><div class="lbl">CHI TIÊU THÁNG 11/2026</div><div class="num">${money(spent)}</div><div class="mute">${S.bookings.length} lượt đặt trong tháng</div></div>
  <div class="card stat"><div class="lbl">CHỜ DUYỆT</div><div class="num">${S.bookings.filter(b=>b.st=='pend').length}</div><div class="mute">${S.bookings.filter(b=>b.st=='ok').length} lịch đã được duyệt</div></div>
  <div class="card stat"><div class="lbl">ĐÁNH GIÁ ĐÃ GỬI</div><div class="num">⭐ ${rated.length?(rated.reduce((a,b)=>a+b.rated,0)/rated.length).toFixed(1):'–'}</div><div class="mute">${done.length-rated.length} buổi chờ bạn đánh giá</div></div>
 </div>
 <div class="g2">
  <div class="card"><div class="row sp-b"><h2>📈 CHI TIÊU 6 THÁNG GẦN NHẤT</h2><span class="mute">Đơn vị: triệu đồng</span></div>
   <div class="chart">${hist.map((v,i)=>`<div><b>${v}tr</b><i class="${i==5?'now':''}" style="height:${v/mx*150}px"></i></div>`).join('')}</div>
   <div class="xl">${L.map(l=>`<span>${l}</span>`).join('')}</div></div>
  <div class="card"><h2>🤖 AI GỢI Ý CHO BẠN</h2><div class="mute" style="margin:-8px 0 6px">Dựa trên lịch sử đặt phòng và đánh giá</div>
   ${[ROOMS[0],ROOMS[2],ROOMS[1]].map((r,i)=>`<button class="li" style="width:100%;text-align:left" data-a="open" data-id="${r.id}"><b style="width:18px">${i+1}.</b><span class="grow"><b>${r.name}</b><span class="mute">${money(r.rate)}/giờ · ⭐ ${r.rating}</span></span><span class="chip">Phù hợp ${[94,88,81][i]}%</span></button>`).join('')}</div>
 </div>
 <div class="g2">
  <div class="card"><div class="row sp-b"><h2>LỊCH ĐẶT GẦN ĐÂY</h2><button class="link" data-a="tab" data-id="bookings">Xem tất cả</button></div>
   ${S.bookings.slice(0,3).map(b=>`<div class="li"><span class="grow"><b>${room(b.room).name}</b><span class="mute">${b.date} · ${b.t} · ${money(b.total)}</span></span>${stChip(b.st)}</div>`).join('')}</div>
  <div class="card"><div class="row sp-b"><h2>WORKSHOP SẮP DIỄN RA</h2><button class="link" data-a="tab" data-id="community">Tất cả</button></div>
   ${WS.map(w=>`<div class="li"><span class="grow"><b>${w[0]}</b><span class="mute">${w[1]} · ${w[2]}</span></span><span class="chip ok">${w[3]}</span></div>`).join('')}</div>
 </div>`}

function explore(){
 const q=S.q.toLowerCase(),L=ROOMS.filter(r=>(S.f=='all'||r.type==S.f)&&(r.name+r.style+r.addr).toLowerCase().includes(q));
 return `<div class="row" style="margin-bottom:8px">${[['all','Tất cả'],['studio','Phòng chụp'],['dark','Phòng tối']].map(f=>`<button class="pill ${S.f==f[0]?'on':''}" data-a="filter" data-id="${f[0]}">${f[1]}</button>`).join('')}<span class="mute" style="margin-left:auto">${L.length} không gian phù hợp</span></div>
 <div class="g3" style="margin-top:16px">${L.map(roomCard).join('')}</div>
 ${L.length?'':'<div class="card mute">Không tìm thấy kết quả. Thử bỏ bớt bộ lọc hoặc đổi từ khóa.</div>'}`}

function detail(){
 const r=room(S.room),eqT=[...S.eq].reduce((a,i)=>a+r.eq[i][1],0),pk=S.pkg!=null?r.pk[S.pkg][2]:0;
 const total=S.start!=null?r.rate*S.dur+eqT+pk:0,end=S.start!=null?S.start+S.dur:0;
 return `<button class="link" data-a="back" style="margin-bottom:18px">← Quay lại danh sách</button>
 <div class="dl"><div>
  <div class="card" style="padding:14px"><div class="cover" style="height:240px;font-size:80px;background:linear-gradient(135deg,${C[r.c][0]},${C[r.c][1]})">${r.e}<span class="tag">${r.style}</span></div>
   <div style="padding:14px 8px 6px"><div class="row sp-b"><h2 style="font-size:24px;margin:0">${r.name}</h2><span class="price" style="font-size:20px">${money(r.rate)}/giờ</span></div>
   <div class="mute" style="margin-top:4px">${r.kind} · ${r.addr} · ⭐ ${r.rating} (${r.n} đánh giá)</div>
   <div class="spec"><div><span class="mute">Diện tích</span><b>${r.area}</b></div><div><span class="mute">Sức chứa</span><b>${r.cap}</b></div><div><span class="mute">Ánh sáng</span><b>${r.light}</b></div><div><span class="mute">Giờ mở cửa</span><b>${r.hours}</b></div></div></div></div>
  <div class="g3" style="grid-template-columns:1fr 1fr;margin-top:20px;align-items:start">
   <div class="card"><h2>THIẾT BỊ THUÊ KÈM</h2>${r.eq.map((e,i)=>`<button class="opt ${S.eq.has(i)?'on':''}" data-a="eq" data-id="${i}"><span>${S.eq.has(i)?'✅':'⬜'}</span><span class="grow"><b>${e[0]}</b></span><span class="price">+${money(e[1])}</span></button>`).join('')}</div>
   <div class="card"><h2>GÓI DỊCH VỤ</h2>${r.pk.map((p,i)=>`<button class="opt ${S.pkg===i?'on':''}" data-a="pkg" data-id="${i}"><span>${S.pkg===i?'🔘':'⚪'}</span><span class="grow"><b>${p[0]}</b><span class="mute">${p[1]}</span></span><span class="price">+${money(p[2])}</span></button>`).join('')}</div>
  </div></div>
  <div class="card panel"><h2>ĐẶT LỊCH</h2>
   <div class="mute">Chọn ngày</div><div class="days">${days.map((d,i)=>`<button class="day ${S.date==i?'on':''}" data-a="date" data-id="${i}"><span>${i?['CN','T2','T3','T4','T5','T6','T7'][d.getDay()]:'Nay'}</span><b>${d.getDate()}</b></button>`).join('')}</div>
   <div class="row sp-b" style="margin-bottom:10px"><span class="mute">Giờ bắt đầu (giờ gạch ngang đã có người đặt)</span><div class="step"><button data-a="dur" data-id="-1">−</button><b>${S.dur} giờ</b><button data-a="dur" data-id="1">+</button></div></div>
   <div class="slots">${hours.map(h=>{const bad=taken(r,S.date,h)||[...Array(S.dur)].some((_,k)=>taken(r,S.date,h+k)||h+k>=20);const on=S.start==h,rg=S.start!=null&&h>S.start&&h<end;
    return `<button class="slot ${on?'on':rg?'rng':''}" ${bad&&!on&&!rg?'disabled':''} data-a="start" data-id="${h}">${hh(h)}</button>`}).join('')}</div>
   <div class="mute" style="margin:18px 0 8px">Thanh toán</div><div class="row">${['VNPay','MoMo','Stripe'].map(p=>`<button class="pill ${S.pay==p?'on':''}" style="margin:0" data-a="pay" data-id="${p}">${p}</button>`).join('')}</div>
   <div class="total"><div><div class="mute">${S.start!=null?hh(S.start)+' – '+hh(end):'Chưa chọn giờ'}</div><span class="mute">Tổng cộng</span></div><span class="price">${total?money(total):'—'}</span></div>
   <button class="btn w" data-a="book" style="${S.start==null?'opacity:.5':''}">Đặt lịch</button></div>
 </div>`}

function bookings(){
 const L=S.bookings.filter(b=>S.bk=='up'?b.st!='done':b.st=='done');
 return `<div class="tabs"><button class="${S.bk=='up'?'on':''}" data-a="bk" data-id="up">Sắp tới</button><button class="${S.bk=='done'?'on':''}" data-a="bk" data-id="done">Đã hoàn thành</button></div>
 <div class="card">${L.length?`<table class="tbl"><tr><th>Phòng</th><th>Ngày & giờ</th><th>Mã đặt</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr>
 ${L.map(b=>`<tr><td><b>${room(b.room).name}</b></td><td>${b.date}<br><span class="mute">${b.t}</span></td><td>${b.id}</td><td class="price">${money(b.total)}</td><td>${stChip(b.st)}</td><td style="text-align:right">${b.st=='done'?(b.rated?`<span class="chip">${'⭐'.repeat(b.rated)}</span>`:`<button class="btn sm" data-a="rate" data-id="${b.id}">Viết đánh giá</button>`):b.st=='ok'?`<button class="btn sm" data-a="qr" data-id="${b.id}">Mã QR</button>`:'<span class="mute">Chờ duyệt</span>'}</td></tr>`).join('')}</table>`:'<div class="mute">Chưa có lịch nào. Hãy khám phá và đặt phòng đầu tiên.</div>'}</div>`}

function community(){
 return `<div class="tabs"><button class="${S.com=='post'?'on':''}" data-a="com" data-id="post">Bài viết</button><button class="${S.com=='ws'?'on':''}" data-a="com" data-id="ws">Workshop</button></div>
 <div class="g3">${S.com=='post'?POSTS.map(p=>`<div class="card"><div class="ph" style="aspect-ratio:2/1;background:var(--soft);font-size:44px">${p[3]}</div><div style="margin-top:14px"><span class="chip">${p[2]}</span><b style="display:block;margin:8px 0 3px;font-size:15.5px">${p[0]}</b><span class="mute">${p[1]}</span></div></div>`).join('')
 :WS.map(w=>`<div class="card"><b style="font-size:15.5px">${w[0]}</b><div class="mute" style="margin:6px 0 16px">${w[1]} · ${w[2]}</div><div class="row sp-b"><span class="chip ok">${w[3]}</span><button class="btn sm" data-a="join">Đăng ký</button></div></div>`).join('')}</div>`}

function profile(){
 const tiles=[['green','🎞️'],['blue','🌫️'],['orange','🌅'],['blue','🏙️'],['green','🌿'],['orange','👤'],['green','☕'],['blue','🌧️']];
 return `<div style="display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start">
  <div class="card" style="text-align:center"><div class="avatar" style="width:84px;height:84px;font-size:28px;margin:0 auto 12px">K7</div><b style="font-size:19px">Khách hàng số 7</b><div style="margin:6px 0 16px"><span class="chip">PHOTOGRAPHER</span></div>
   <div class="row sp-b" style="padding:10px 0;border-top:1px solid var(--line)"><span class="mute">Lượt đặt</span><b>${S.bookings.length}</b></div>
   <div class="row sp-b" style="padding:10px 0;border-top:1px solid var(--line)"><span class="mute">Đã hoàn thành</span><b>${S.bookings.filter(b=>b.st=='done').length}</b></div>
   <button class="btn ghost w" style="margin-top:12px" data-a="toast" data-id="Đây là chế độ demo">Hồ sơ & bảo mật</button></div>
  <div><div class="card"><div class="row sp-b"><h2>BỘ SƯU TẬP ẢNH</h2><button class="link" data-a="toast" data-id="Tải ảnh lên sẽ có ở bản sau">Tải lên</button></div>
   <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">${tiles.map(t=>`<div class="ph" style="background:linear-gradient(135deg,${C[t[0]][0]},${C[t[0]][1]})">${t[1]}</div>`).join('')}</div></div>
  <div class="card" style="margin-top:20px"><h2>CÔNG CỤ AI</h2>
   <button class="opt" data-a="toast" data-id="Phục hồi ảnh cũ: đang phát triển"><span>🖼️</span><span class="grow"><b>Phục hồi ảnh cũ</b><span class="mute">Làm nét và khử xước ảnh phim đã scan</span></span></button>
   <button class="opt" data-a="ai"><span>💬</span><span class="grow"><b>Hỏi trợ lý nhiếp ảnh</b><span class="mute">Kỹ thuật chụp, tráng phim, chọn thiết bị</span></span></button></div></div></div>`}

function render(){
 $('#side').innerHTML=NAV.map(n=>`<button class="${S.tab==n[0]&&!S.room?'on':''}" data-a="tab" data-id="${n[0]}"><span>${n[1]}</span><span>${n[2]}</span></button>`).join('')+'<button data-a="mobile"><span>📱</span><span>Bản mobile</span></button>';
 $('#title').textContent=S.room?room(S.room).name:TITLES[S.tab];
 $('#view').innerHTML=S.room?detail():{home,explore,bookings,community,profile}[S.tab]();
 renderAI();
}
function renderAI(){
 $('#ai').innerHTML=(S.aiOpen?`<div class="aibox"><div class="row sp-b" style="margin-bottom:10px"><b>🤖 Trợ lý AI</b><button class="link" data-a="ai">Đóng</button></div><div style="max-height:260px;overflow:auto">${S.chat.map(m=>`<div class="msg ${m[0]}">${m[1]}</div>`).join('')}</div>
 <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${['Gợi ý phòng cho chân dung','Nên thuê thiết bị nào?','Tráng phim B&W cần gì?'].map(t=>`<button class="pill" style="margin:0;text-align:left" data-a="ask" data-id="${t}">${t}</button>`).join('')}</div></div>`:'')+`<button class="aibtn" data-a="ai">🤖 Trợ lý AI</button>`}
const ANS={'Gợi ý phòng cho chân dung':'Với chân dung, bạn nên thử Phòng chụp Vintage (270.000 đ/giờ): ánh sáng ấm hợp phim Portra 400. Gói “Chân dung phim 2h” đã gồm phông retro.',
 'Nên thuê thiết bị nào?':'Nếu chưa có máy, Nikon FM2 + 50mm là lựa chọn dễ dùng. Thêm đèn nền tungsten nếu chụp trong nhà vào buổi chiều.',
 'Tráng phim B&W cần gì?':'Bạn cần hóa chất B&W, tank tráng và nơi tối hoàn toàn. Phòng tối B&W có gói “Tráng phim cơ bản” kèm hướng dẫn 1-1.'};
function sheet(html){closeSheet();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="sheet">${html}</div>`;o.onclick=e=>{if(e.target==o)closeSheet()};document.body.append(o)}
function closeSheet(){const o=$('#ov');o&&o.remove()}
function rateSheet(){sheet(`<h2 style="margin-bottom:8px">Đánh giá buổi chụp</h2><div class="stars row" style="margin:12px 0 18px">${[1,2,3,4,5].map(i=>`<button class="${S.rs>=i?'on':''}" data-a="star" data-id="${i}">⭐</button>`).join('')}</div><button class="btn w" data-a="sendrate">Gửi đánh giá</button>`)}

$('#gq').addEventListener('input',e=>{S.q=e.target.value;if(S.tab!='explore'||S.room){S.tab='explore';S.room=null}render()});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 if(a=='tab'){S.tab=id;S.room=null;location.hash=id}
 else if(a=='mobile')location.href='customer-app.html';
 else if(a=='filter')S.f=id;
 else if(a=='open'){S.room=+id;Object.assign(S,{date:0,start:null,dur:2,eq:new Set(),pkg:null});scrollTo(0,0)}
 else if(a=='back')S.room=null;
 else if(a=='date'){S.date=+id;S.start=null}
 else if(a=='dur'){S.dur=Math.max(1,Math.min(6,S.dur+ +id));S.start=null}
 else if(a=='start')S.start=+id;
 else if(a=='eq'){S.eq.has(+id)?S.eq.delete(+id):S.eq.add(+id)}
 else if(a=='pkg')S.pkg=S.pkg===+id?null:+id;
 else if(a=='pay')S.pay=id;
 else if(a=='bk')S.bk=id;
 else if(a=='com')S.com=id;
 else if(a=='theme'){const d=document.documentElement,dark=d.dataset.theme=='dark'||(!d.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);d.dataset.theme=dark?'light':'dark'}
 else if(a=='toast')toast(id);
 else if(a=='join')toast('Đã đăng ký workshop');
 else if(a=='close')closeSheet();
 else if(a=='ai')S.aiOpen=!S.aiOpen;
 else if(a=='ask'){S.chat.push(['me',id],['ai',ANS[id]])}
 else if(a=='qr'){const bk=S.bookings.find(x=>x.id==id);sheet(`<div style="text-align:center"><h2>${room(bk.room).name}</h2><div class="mute">${bk.date} · ${bk.t}</div>${qrHtml(bk.id)}<b>${bk.id}</b><div class="mute" style="margin:6px 0 16px">Đưa mã này cho nhà cung cấp khi đến phòng</div><button class="btn ghost w" data-a="close">Đóng</button></div>`);return}
 else if(a=='rate'){S.rid=id;S.rs=0;rateSheet();return}
 else if(a=='star'){S.rs=+id;rateSheet();return}
 else if(a=='sendrate'){if(!S.rs){toast('Chọn số sao trước');return}S.bookings.find(x=>x.id==S.rid).rated=S.rs;closeSheet();toast('Đã gửi đánh giá')}
 else if(a=='book'){
  if(S.start==null){toast('Hãy chọn giờ bắt đầu');return}
  const r=room(S.room),eqT=[...S.eq].reduce((x,i)=>x+r.eq[i][1],0),pk=S.pkg!=null?r.pk[S.pkg][2]:0,d=days[S.date];
  S.bookings.unshift({id:'FH-'+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+Math.floor(100+Math.random()*900),room:r.id,date:fd(d),t:hh(S.start)+' – '+hh(S.start+S.dur),st:'pend',total:r.rate*S.dur+eqT+pk});
  S.room=null;S.tab='bookings';S.bk='up';toast('Đã gửi yêu cầu. Chờ nhà cung cấp duyệt')}
 render();
});
const h=location.hash.slice(1);if(TITLES[h])S.tab=h;
render();
</script>
</body>
</html>
