<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm / Sửa Phòng - Provider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .phone-frame {
            width: 390px;
            height: 800px;
            background: #1e293b;
            border-radius: 46px;
            border: 10px solid #283548;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .app-screen {
            flex: 1;
            background: #eaf1f8;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .app-screen::-webkit-scrollbar {
            display: none;
        }

        .top-bar {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }

        .back-btn {
            font-size: 1.2rem;
            color: #0f172a;
            text-decoration: none;
            font-weight: bold;
        }

        .page-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #0f172a;
        }

        .form-container {
            padding: 15px 20px;
        }

        .card-form {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            font-size: 0.72rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 8px 10px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.78rem;
            color: #0f172a;
            outline: none;
        }

        .form-textarea {
            height: 55px;
            resize: none;
        }

        .equip-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: #f8fafc;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: #334155;
        }

        .submit-btn {
            display: block;
            width: 100%;
            background: #0284c7;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin-top: 12px;
        }

        .submit-btn:hover {
            background: #0369a1;
        }

        .bottom-nav {
            height: 60px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.65rem;
            color: #64748b;
            gap: 2px;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active {
            color: #0284c7;
            font-weight: 700;
        }

        .nav-icon {
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="app-screen">
            
            <div class="top-bar">
                <a href="provider-rooms.html" class="back-btn">←</a>
                <span class="page-title">Thông tin Phòng / Studio</span>
                <span style="opacity: 0;">←</span>
            </div>

            <div class="form-container">
                <div class="card-form">
                    <form id="roomForm" novalidate>

                        <div class="form-group">
                            <label class="form-label" for="roomName">Tên phòng</label>
                            <input type="text" id="roomName" class="form-input" required minlength="2" maxlength="100" placeholder="VD: SAIGON DARKROOM Q1">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="studioId">Cơ sở</label>
                            <select id="studioId" class="form-select" required></select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="roomType">Loại hình</label>
                            <select id="roomType" class="form-select">
                                <option value="DARKROOM">Phòng Tối (Darkroom)</option>
                                <option value="STUDIO">Studio Chụp ảnh</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="roomPrice">Giá thuê (VNĐ / giờ)</label>
                            <input type="number" id="roomPrice" class="form-input" required min="0" step="1000" placeholder="150000">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="roomCap">Sức chứa (người)</label>
                            <input type="number" id="roomCap" class="form-input" required min="1" step="1" placeholder="4">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="roomDesc">Mô tả phòng</label>
                            <textarea id="roomDesc" class="form-textarea" maxlength="2000" placeholder="Phòng tối tiêu chuẩn phục vụ tráng/rọi ảnh..."></textarea>
                        </div>

                        <div id="formError" role="alert" style="display:none;color:#dc2626;font-size:0.72rem;font-weight:700;margin-top:6px;"></div>

                        <button type="submit" class="submit-btn" id="submitBtn">LƯU THÔNG TIN</button>

                    </form>
                </div>
            </div>

            <div class="bottom-nav">
                <a href="provider-index.html" class="nav-item">
                    <span class="nav-icon">🧭</span>
                    <span>Khám phá</span>
                </a>
                <a href="provider-bookings.html" class="nav-item">
                    <span class="nav-icon">📅</span>
                    <span>Lịch hẹn</span>
                </a>
                <a href="provider-rooms.html" class="nav-item active">
                    <span class="nav-icon">🧪</span>
                    <span>Lab</span>
                </a>
                <a href="provider-dashboard.html" class="nav-item">
                    <span class="nav-icon">👤</span>
                    <span>Hồ sơ</span>
                </a>
            </div>

        </div>
    </div>

    <script src="provider-common.js"></script>
    <script>Provider.addPcShortcut('provider-pc-rooms.html');</script>
    <script>
        (async function () {
            const P = Provider, $ = id => document.getElementById(id);
            const editId = new URLSearchParams(location.search).get('id');
            const errBox = $('formError');
            const showErr = m => { errBox.textContent = m; errBox.style.display = m ? 'block' : 'none'; };

            // Tải danh sách cơ sở (và phòng cần sửa) từ Backend / demo
            let studios = [], room = null;
            try {
                studios = await P.data.studios();
                if (editId) {
                    const rooms = await P.data.rooms(studios);
                    room = rooms.find(r => String(r.room_id) === editId) || null;
                }
            } catch (e) { showErr('Không tải được dữ liệu: ' + e.message); }

            $('studioId').innerHTML = studios.map(s => `<option value="${s.studio_id}">${P.esc(s.name)}</option>`).join('');
            if (!studios.length) showErr('Bạn chưa có cơ sở nào. Hãy tạo cơ sở (Studio) trước — có sẵn trên bản PC (mục Phòng & Studio).');

            if (room) {
                document.querySelector('.page-title').textContent = 'Sửa thông tin phòng';
                $('roomName').value = room.name;
                $('studioId').value = room.studio_id;
                $('studioId').disabled = true;      // backend không cho đổi cơ sở khi sửa
                $('roomType').value = room.room_type;
                $('roomPrice').value = room.price_per_hour;
                $('roomCap').value = room.capacity;
                $('roomDesc').value = room.description || '';
            } else if (editId) {
                showErr('Không tìm thấy phòng cần sửa.');
            } else {
                document.querySelector('.page-title').textContent = 'Thêm phòng mới';
            }

            $('roomForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                showErr('');
                if (!P.requireLogin()) return;

                const payload = {
                    studio_id: Number($('studioId').value),
                    name: $('roomName').value.trim(),
                    room_type: $('roomType').value,
                    capacity: parseInt($('roomCap').value, 10),
                    price_per_hour: parseFloat($('roomPrice').value),
                    description: $('roomDesc').value.trim() || null
                };
                if (payload.name.length < 2) return showErr('Tên phòng tối thiểu 2 ký tự.');
                if (!payload.studio_id) return showErr('Vui lòng chọn cơ sở.');
                if (!(payload.price_per_hour >= 0)) return showErr('Giá thuê không hợp lệ.');
                if (!(payload.capacity >= 1)) return showErr('Sức chứa phải từ 1 người.');

                const btn = $('submitBtn'); btn.disabled = true; btn.textContent = 'ĐANG LƯU...';
                try {
                    await P.data.saveRoom(editId, payload);
                    P.toast(editId ? 'Đã cập nhật phòng' : 'Đã thêm phòng mới', 'ok');
                    setTimeout(() => { location.href = 'provider-rooms.html'; }, 700);
                } catch (err) {
                    showErr(err.message);
                    btn.disabled = false; btn.textContent = 'LƯU THÔNG TIN';
                }
            });
        })();
    </script>

</body>
</html>
