<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm / Sửa Phòng - Provider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .phone-frame {
            width: 390px;
            height: 800px;
            background: #1e293b;
            border-radius: 46px;
            border: 10px solid #283548;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .app-screen {
            flex: 1;
            background: #eaf1f8;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .app-screen::-webkit-scrollbar {
            display: none;
        }

        .top-bar {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }

        .back-btn {
            font-size: 1.2rem;
            color: #0f172a;
            text-decoration: none;
            font-weight: bold;
        }

        .page-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #0f172a;
        }

        .form-container {
            padding: 15px 20px;
        }

        .card-form {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            font-size: 0.72rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 8px 10px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.78rem;
            color: #0f172a;
            outline: none;
        }

        .form-textarea {
            height: 55px;
            resize: none;
        }

        .equip-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: #f8fafc;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: #334155;
        }

        .submit-btn {
            display: block;
            width: 100%;
            background: #0284c7;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin-top: 12px;
        }

        .submit-btn:hover {
            background: #0369a1;
        }

        .bottom-nav {
            height: 60px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.65rem;
            color: #64748b;
            gap: 2px;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active {
            color: #0284c7;
            font-weight: 700;
        }

        .nav-icon {
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="app-screen">
            
            <div class="top-bar">
                <a href="provider-rooms.html" class="back-btn">←</a>
                <span class="page-title">Thông tin Phòng / Studio</span>
                <span style="opacity: 0;">←</span>
            </div>

            <div class="form-container">
                <div class="card-form">
                    <form onsubmit="event.preventDefault(); alert('Đã lưu thông tin phòng thành công!'); window.location.href='provider-rooms.html';">
                        
                        <div class="form-group">
                            <label class="form-label">Tên cơ sở / Tên phòng</label>
                            <input type="text" class="form-input" required value="SAIGON DARKROOM Q1">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Loại cơ sở</label>
                            <select class="form-select">
                                <option selected>Phòng Tối (Darkroom)</option>
                                <option>Studio Chụp ảnh</option>
                                <option>Trạm Scan Phim</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Giá thuê (VNĐ / giờ)</label>
                            <input type="number" class="form-input" required value="150000">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Mô tả phòng</label>
                            <textarea class="form-textarea">Phòng tối tiêu chuẩn phục vụ tráng/rọi ảnh đen trắng & màu.</textarea>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Thiết bị có sẵn</label>
                            <div class="equip-grid">
                                <label class="checkbox-item"><input type="checkbox" checked> Máy rọi Kaiser</label>
                                <label class="checkbox-item"><input type="checkbox" checked> Hóa chất C41</label>
                                <label class="checkbox-item"><input type="checkbox" checked> Tank Paterson</label>
                                <label class="checkbox-item"><input type="checkbox" checked> Đèn an toàn</label>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn">LƯU THÔNG TIN</button>

                    </form>
                </div>
            </div>

            <div class="bottom-nav">
                <a href="provider-index.html" class="nav-item">
                    <span class="nav-icon">🧭</span>
                    <span>Khám phá</span>
                </a>
                <a href="provider-bookings.html" class="nav-item">
                    <span class="nav-icon">📅</span>
                    <span>Lịch hẹn</span>
                </a>
                <a href="provider-rooms.html" class="nav-item active">
                    <span class="nav-icon">🧪</span>
                    <span>Lab</span>
                </a>
                <a href="provider-dashboard.html" class="nav-item">
                    <span class="nav-icon">👤</span>
                    <span>Hồ sơ</span>
                </a>
            </div>

        </div>
    </div>

</body>
</html>
