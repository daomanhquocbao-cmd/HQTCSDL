<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập & Đăng ký - Studio Booking</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .auth-card { background: #fff; width: 100%; max-width: 440px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); overflow: hidden; }
    .tabs { display: flex; border-bottom: 1px solid #e5e7eb; }
    .tab-btn { flex: 1; padding: 14px; background: #f9fafb; border: none; font-size: 15px; font-weight: 600; color: #6b7280; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #fff; color: #2563eb; border-bottom: 2px solid #2563eb; }
    .form-container { padding: 24px; }
    .auth-form { display: none; flex-direction: column; gap: 14px; }
    .auth-form.active { display: flex; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 600; color: #374151; }
    input { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus { border-color: #2563eb; }
    .hint { font-size: 12px; color: #6b7280; }
    .btn-submit { margin-top: 6px; padding: 11px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-submit:hover { background: #1d4ed8; }
    .message { font-size: 13px; text-align: center; min-height: 18px; }
    .message.error { color: #dc2626; }
    .message.success { color: #16a34a; }
    .back-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #6b7280; text-decoration: none; }
    .back-link:hover { color: #2563eb; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="tabs">
      <button type="button" class="tab-btn active" onclick="switchTab('login')">Đăng nhập</button>
      <button type="button" class="tab-btn" onclick="switchTab('register')">Đăng ký</button>
    </div>

    <div class="form-container">
      <!-- Form Đăng nhập: khớp UserLogin(username, password) -->
      <form id="loginForm" class="auth-form active">
        <div class="form-group">
          <label for="loginUsername">Tên đăng nhập (Username)</label>
          <input type="text" id="loginUsername" required placeholder="customer01" />
        </div>
        <div class="form-group">
          <label for="loginPassword">Mật khẩu</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn-submit">Đăng nhập</button>
        <div id="loginMsg" class="message"></div>
      </form>

      <!-- Form Đăng ký: khớp UserRegister(username, email, password, full_name, phone, role) -->
      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="regUsername">Tên đăng nhập (Username)</label>
          <input type="text" id="regUsername" required minlength="3" maxlength="50" pattern="[A-Za-z0-9_.]+" placeholder="nguyenvana" />
          <span class="hint">Từ 3–50 ký tự, chỉ gồm chữ cái, số, dấu gạch dưới (_) hoặc dấu chấm (.)</span>
        </div>
        <div class="form-group">
          <label for="regFullName">Họ và tên</label>
          <input type="text" id="regFullName" required minlength="2" maxlength="100" placeholder="Nguyễn Văn A" />
        </div>
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" required maxlength="100" placeholder="nhapemail@example.com" />
        </div>
        <div class="form-group">
          <label for="regPhone">Số điện thoại</label>
          <input type="tel" id="regPhone" maxlength="20" placeholder="0901234567" />
        </div>
        <div class="form-group">
          <label for="regPassword">Mật khẩu</label>
          <input type="password" id="regPassword" required minlength="8" maxlength="128" placeholder="Tối thiểu 8 ký tự" />
        </div>
        <button type="submit" class="btn-submit">Tạo tài khoản khách hàng</button>
        <div id="regMsg" class="message"></div>
      </form>

      <a href="index.html" class="back-link">← Quay lại trang chủ</a>
    </div>
  </div>

  <script>
    // FastAPI mặc định chạy cổng 8000, endpoint router prefix là /api/users
    const API_BASE = 'http://localhost:8000/api/users';

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (tab === 'login' && idx === 0) || (tab === 'register' && idx === 1));
      });
      document.getElementById('loginForm').classList.toggle('active', tab === 'login');
      document.getElementById('registerForm').classList.toggle('active', tab === 'register');
    }

    function extractErrorMessage(data, fallback) {
      if (!data) return fallback;
      if (typeof data.detail === 'string') return data.detail;
      if (Array.isArray(data.detail) && data.detail.length > 0) {
        return data.detail.map(err => err.msg).join(', ');
      }
      return data.message || fallback;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('loginMsg');
      msg.textContent = 'Đang xử lý...';
      msg.className = 'message';

      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('loginUsername').value.trim(),
            password: document.getElementById('loginPassword').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(extractErrorMessage(data, 'Đăng nhập thất bại'));

        if (data.access_token) {
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('token', data.access_token);
        }
        if (data.user) {
          localStorage.setItem('user', JSON.stringify(data.user));
        }

        msg.textContent = 'Đăng nhập thành công! Đang chuyển hướng...';
        msg.classList.add('success');
        setTimeout(() => window.location.href = 'index.html', 700);
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.add('error');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('regMsg');
      msg.textContent = 'Đang xử lý...';
      msg.className = 'message';

      const phoneVal = document.getElementById('regPhone').value.trim();

      try {
        const res = await fetch(`${API_BASE}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('regUsername').value.trim(),
            full_name: document.getElementById('regFullName').value.trim(),
            email: document.getElementById('regEmail').value.trim(),
            phone: phoneVal || null,
            password: document.getElementById('regPassword').value,
            role: 'CUSTOMER'
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(extractErrorMessage(data, 'Đăng ký thất bại'));

        msg.textContent = 'Đăng ký thành công! Bạn có thể đăng nhập ngay.';
        msg.classList.add('success');
        const createdUsername = document.getElementById('regUsername').value.trim();
        e.target.reset();
        setTimeout(() => {
          switchTab('login');
          document.getElementById('loginUsername').value = createdUsername;
        }, 800);
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.add('error');
      }
    });
  </script>
</body>
</html>
