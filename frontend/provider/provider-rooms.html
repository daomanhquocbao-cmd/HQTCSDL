<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Phòng & Cơ sở - Provider Hub</title>
    <link rel="stylesheet" href="../assets/css/provider-mobile.css">
</head>
<body class="m">
<div class="m-app">
    <header class="m-top" id="mTop"></header>
    <main class="m-main">
        <div class="alert bad" id="pageError" role="alert" hidden></div>

        <div class="tabs" id="seg" role="tablist" aria-label="Chọn danh sách">
            <button class="tab active" role="tab" data-seg="rooms" aria-selected="true">Phòng<span class="count" id="cRooms">0</span></button>
            <button class="tab" role="tab" data-seg="studios" aria-selected="false">Cơ sở<span class="count" id="cStudios">0</span></button>
        </div>

        <section id="paneRooms" class="m-main" style="padding:0">
            <div class="m-filters">
                <input class="input" id="search" type="search" placeholder="Tìm theo tên phòng..." aria-label="Tìm phòng">
                <select class="select" id="fStudio" aria-label="Lọc theo cơ sở"><option value="">Tất cả cơ sở</option></select>
                <select class="select" id="fStatus" aria-label="Lọc theo trạng thái"><option value="">Mọi trạng thái</option><option value="AVAILABLE" selected>Đang hoạt động</option><option value="MAINTENANCE">Bảo trì</option><option value="INACTIVE">Đã ẩn</option></select>
            </div>
            <div class="m-list" id="roomList"></div>
            <div class="muted small" id="summary"></div>
        </section>

        <section id="paneStudios" class="m-main" style="padding:0" hidden>
            <div class="alert warn" id="pendingHint" hidden>⏳ Cơ sở <b>Chờ duyệt</b> cần quản trị viên phê duyệt trước khi khách nhìn thấy cơ sở và phòng.</div>
            <div class="m-list" id="studioList"></div>
        </section>
        <button class="m-fab" id="fab" aria-label="Thêm phòng">+</button>
    </main>
</div>
<div class="modal-overlay" id="roomModal" role="dialog" aria-modal="true" aria-labelledby="roomModalTitle">
    <form class="modal" id="roomForm" novalidate>
        <div class="modal-head"><span id="roomModalTitle">Thêm phòng</span><button type="button" class="icon-btn" data-close aria-label="Đóng">✕</button></div>
        <div class="form-grid">
            <div class="field full"><label for="rName">Tên phòng</label><input class="input" id="rName" maxlength="100" required><div class="err" data-err="name"></div></div>
            <div class="field"><label for="rStudio">Cơ sở</label><select class="select" id="rStudio" required></select><div class="err" data-err="studio_id"></div></div>
            <div class="field"><label for="rType">Loại hình</label><select class="select" id="rType"><option value="DARKROOM">Phòng tối (Darkroom)</option><option value="STUDIO">Studio chụp ảnh</option></select></div>
            <div class="field"><label for="rPrice">Giá thuê (VNĐ / giờ)</label><input class="input" id="rPrice" type="number" inputmode="numeric" min="0" step="1000" required><div class="err" data-err="price_per_hour"></div></div>
            <div class="field"><label for="rCap">Sức chứa (người)</label><input class="input" id="rCap" type="number" inputmode="numeric" min="1" step="1" required><div class="err" data-err="capacity"></div></div>
            <div class="field"><label for="rArea">Diện tích (m²)</label><input class="input" id="rArea" type="number" inputmode="decimal" min="0" step="0.5"></div>
            <div class="field"><label for="rStatus">Trạng thái</label><select class="select" id="rStatus"><option value="AVAILABLE">Đang hoạt động</option><option value="MAINTENANCE">Bảo trì</option><option value="INACTIVE">Đã ẩn</option></select></div>
            <div class="field"><label for="rStyle">Phong cách</label><input class="input" id="rStyle" maxlength="100" placeholder="Vintage, tối giản..."></div>
            <div class="field"><label for="rLight">Ánh sáng</label><input class="input" id="rLight" maxlength="200" placeholder="Đèn đỏ an toàn, Godox..."></div>
            <div class="field full"><label for="rAmen">Tiện ích đi kèm</label><input class="input" id="rAmen" maxlength="500" placeholder="Bồn rửa, kệ phơi, máy lạnh..."></div>
            <div class="field full"><label for="rDesc">Mô tả</label><textarea class="textarea" id="rDesc" maxlength="2000"></textarea></div>
        </div>
        <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Hủy</button><button type="submit" class="btn btn-primary" id="roomSave">Lưu phòng</button></div>
    </form>
</div>
<div class="modal-overlay" id="studioModal" role="dialog" aria-modal="true" aria-labelledby="studioModalTitle">
    <form class="modal" id="studioForm" novalidate>
        <div class="modal-head"><span id="studioModalTitle">Thêm cơ sở mới</span><button type="button" class="icon-btn" data-close aria-label="Đóng">✕</button></div>
        <div class="form-grid">
            <div class="field full"><label for="sName">Tên cơ sở</label><input class="input" id="sName" maxlength="100" required><div class="err" data-err="name"></div></div>
            <div class="field full"><label for="sAddr">Địa chỉ</label><input class="input" id="sAddr" maxlength="255" required><div class="err" data-err="address"></div></div>
            <div class="field"><label for="sCity">Thành phố</label><input class="input" id="sCity" maxlength="100" required><div class="err" data-err="city"></div></div>
            <div class="field"><label for="sPhone">Số điện thoại</label><input class="input" id="sPhone" type="tel" maxlength="20"></div>
            <div class="field"><label for="sOpen">Giờ mở cửa</label><input class="input" id="sOpen" type="time" value="08:00" required></div>
            <div class="field"><label for="sClose">Giờ đóng cửa</label><input class="input" id="sClose" type="time" value="21:00" required><div class="err" data-err="hours"></div></div>
            <div class="field full"><label for="sDesc">Mô tả</label><textarea class="textarea" id="sDesc" maxlength="4000"></textarea></div>
        </div>
        <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Hủy</button><button type="submit" class="btn btn-primary" id="studioSave">Lưu cơ sở</button></div>
    </form>
</div>
<nav class="m-nav" id="mNav" aria-label="Điều hướng chính"></nav>
<script src="../assets/js/provider-common.js"></script>
<script>
(async function () {
    const P = Provider, $ = id => document.getElementById(id);
    await P.mountMobile('rooms', 'Phòng & Cơ sở');
    let studios = [], rooms = [], editingId = null, editingStudioId = null, seg = 'rooms';
    const S = P.bindSheets();

    async function load() {
        try {
            [studios, rooms] = await Promise.all([P.data.studios(), P.data.rooms()]);
            P.refreshChrome();
            const keep = $('fStudio').value, opts = studios.map(s => `<option value="${s.studio_id}">${P.esc(s.name)}</option>`).join('');
            $('fStudio').innerHTML = '<option value="">Tất cả cơ sở</option>' + opts; $('fStudio').value = keep;
            $('rStudio').innerHTML = opts;
            render();
        } catch (err) { const b = $('pageError'); b.hidden = false; b.textContent = 'Không tải được dữ liệu: ' + err.message; }
    }
    const studioName = id => (studios.find(s => s.studio_id === id) || {}).name || '—';

    function render() {
        $('cRooms').textContent = rooms.length; $('cStudios').textContent = studios.length;
        const q = $('search').value.trim().toLowerCase();
        const list = rooms.filter(r => (!q || r.name.toLowerCase().includes(q)) && (!$('fStudio').value || String(r.studio_id) === $('fStudio').value) && (!$('fStatus').value || r.status === $('fStatus').value))
            .sort((a, b) => a.name.localeCompare(b.name, 'vi'));
        $('roomList').innerHTML = list.map(r => {
            const st = P.ROOM_STATUS[r.status] || { label: r.status, cls: 'muted' }, hidden = r.status === 'INACTIVE';
            return `<div class="m-item">
                <div class="m-item-head"><div><strong>${P.esc(r.name)}</strong><span class="sub">${P.esc(studioName(r.studio_id))} • ${P.esc(P.ROOM_TYPES[r.room_type] || r.room_type)}</span></div><span class="badge ${st.cls}">${st.label}</span></div>
                <div class="row"><span>👥 ${r.capacity} người${r.area_sqm ? ' • ' + r.area_sqm + ' m²' : ''}${r.art_style ? ' • ' + P.esc(r.art_style) : ''}</span><b>${P.money(r.price_per_hour)}/giờ</b></div>
                ${r.description ? `<span class="sub">${P.esc(r.description.slice(0, 90))}${r.description.length > 90 ? '…' : ''}</span>` : ''}
                <div class="m-actions">
                    <button class="btn btn-ghost btn-sm" data-edit="${r.room_id}">Sửa</button>
                    <button class="btn ${hidden ? 'btn-ok' : 'btn-bad'} btn-sm" data-toggle="${r.room_id}">${hidden ? 'Hiện lại' : 'Ẩn phòng'}</button>
                </div></div>`;
        }).join('') || `<div class="card empty">${rooms.length ? 'Không có phòng nào khớp bộ lọc.' : 'Chưa có phòng nào. Bấm nút + để thêm.'}</div>`;
        $('summary').textContent = `Hiển thị ${list.length} / ${rooms.length} phòng`;

        $('pendingHint').hidden = !studios.some(x => x.status === 'PENDING');
        $('studioList').innerHTML = studios.map(s => {
            const st = P.STUDIO_STATUS[s.status] || { label: s.status, cls: 'muted' }, n = rooms.filter(r => r.studio_id === s.studio_id).length;
            return `<div class="m-item">
                <div class="m-item-head"><div><strong>${P.esc(s.name)}</strong><span class="sub">${P.esc(s.address)}, ${P.esc(s.city)}</span></div><span class="badge ${st.cls}">${st.label}</span></div>
                <div class="row"><span>🕘 ${P.esc(String(s.open_time || '').slice(0, 5))} – ${P.esc(String(s.close_time || '').slice(0, 5))}${s.phone ? ' • ' + P.esc(s.phone) : ''}</span><b>${n} phòng</b></div>
                <div class="m-actions">
                    <button class="btn btn-ghost btn-sm" data-sedit="${s.studio_id}">Sửa</button>
                    <button class="btn btn-bad btn-sm" data-sdel="${s.studio_id}">Xóa</button>
                </div></div>`;
        }).join('') || '<div class="card empty">Chưa có cơ sở nào. Bấm nút + để thêm.</div>';
    }
    ['search', 'fStudio', 'fStatus'].forEach(id => $(id).addEventListener(id === 'search' ? 'input' : 'change', render));

    function setSeg(k) {
        seg = k;
        document.querySelectorAll('[data-seg]').forEach(b => { const on = b.dataset.seg === k; b.classList.toggle('active', on); b.setAttribute('aria-selected', on); });
        $('paneRooms').hidden = k !== 'rooms'; $('paneStudios').hidden = k !== 'studios';
        $('fab').setAttribute('aria-label', k === 'rooms' ? 'Thêm phòng' : 'Thêm cơ sở');
    }
    $('seg').addEventListener('click', e => { const b = e.target.closest('[data-seg]'); if (b) setSeg(b.dataset.seg); });
    $('fab').onclick = () => seg === 'rooms' ? openRoomForm(null) : openStudioForm(null);

    const clearErrors = f => { f.querySelectorAll('[data-err]').forEach(e => e.textContent = ''); f.querySelectorAll('.invalid').forEach(e => e.classList.remove('invalid')); };
    const setErr = (f, key, msg, inputId) => { const e = f.querySelector(`[data-err="${key}"]`); if (e) e.textContent = msg; if (inputId) $(inputId).classList.add('invalid'); };

    function openRoomForm(room) {
        if (!studios.length) { P.toast('Bạn cần tạo cơ sở (Studio) trước khi thêm phòng.', 'warn'); setSeg('studios'); openStudioForm(null); return; }
        editingId = room ? room.room_id : null; clearErrors($('roomForm'));
        $('roomModalTitle').textContent = room ? 'Sửa thông tin phòng' : 'Thêm phòng';
        $('rName').value = room ? room.name : '';
        $('rStudio').value = room ? room.studio_id : studios[0].studio_id; $('rStudio').disabled = !!room;
        $('rType').value = room ? room.room_type : 'DARKROOM';
        $('rPrice').value = room ? room.price_per_hour : ''; $('rCap').value = room ? room.capacity : '';
        $('rDesc').value = room ? (room.description || '') : '';
        $('rArea').value = room && room.area_sqm != null ? room.area_sqm : '';
        $('rStyle').value = room ? (room.art_style || '') : ''; $('rLight').value = room ? (room.lighting || '') : ''; $('rAmen').value = room ? (room.amenities || '') : '';
        $('rStatus').value = room ? room.status : 'AVAILABLE';
        S.open('roomModal');
    }
    function openStudioForm(studio) {
        studio = studio && studio.studio_id ? studio : null;
        editingStudioId = studio ? studio.studio_id : null;
        clearErrors($('studioForm')); $('studioForm').reset();
        $('studioModalTitle').textContent = studio ? 'Sửa thông tin cơ sở' : 'Thêm cơ sở mới';
        if (studio) {
            $('sName').value = studio.name || ''; $('sAddr').value = studio.address || ''; $('sCity').value = studio.city || '';
            $('sPhone').value = studio.phone || ''; $('sDesc').value = studio.description || '';
            $('sOpen').value = String(studio.open_time || '08:00').slice(0, 5); $('sClose').value = String(studio.close_time || '21:00').slice(0, 5);
        }
        S.open('studioModal');
    }

    $('roomForm').addEventListener('submit', async e => {
        e.preventDefault(); const f = $('roomForm'); clearErrors(f);
        const payload = {
            studio_id: Number($('rStudio').value), name: $('rName').value.trim(), room_type: $('rType').value,
            capacity: parseInt($('rCap').value, 10), price_per_hour: parseFloat($('rPrice').value),
            description: $('rDesc').value.trim() || null, area_sqm: $('rArea').value === '' ? null : parseFloat($('rArea').value),
            art_style: $('rStyle').value.trim() || null, lighting: $('rLight').value.trim() || null, amenities: $('rAmen').value.trim() || null, status: $('rStatus').value
        };
        let bad = false;
        if (payload.name.length < 2) { setErr(f, 'name', 'Tên phòng tối thiểu 2 ký tự.', 'rName'); bad = true; }
        if (!(payload.price_per_hour >= 0)) { setErr(f, 'price_per_hour', 'Nhập giá thuê hợp lệ (≥ 0).', 'rPrice'); bad = true; }
        if (!(payload.capacity >= 1)) { setErr(f, 'capacity', 'Sức chứa phải từ 1 người.', 'rCap'); bad = true; }
        if (payload.area_sqm !== null && !(payload.area_sqm > 0)) { P.toast('Diện tích phải lớn hơn 0.', 'warn'); bad = true; }
        if (!payload.studio_id) { setErr(f, 'studio_id', 'Chọn cơ sở.', 'rStudio'); bad = true; }
        if (bad) return;
        const btn = $('roomSave'); btn.disabled = true; btn.textContent = 'Đang lưu...';
        try { await P.data.saveRoom(editingId, payload); S.close($('roomModal')); P.toast(editingId ? 'Đã cập nhật phòng.' : 'Đã thêm phòng mới.', 'ok'); await load(); }
        catch (err) { P.toast((err.status === 401 || err.status === 403 ? 'Phiên đăng nhập không hợp lệ hoặc không đủ quyền: ' : 'Lưu thất bại: ') + err.message, 'bad'); }
        finally { btn.disabled = false; btn.textContent = 'Lưu phòng'; }
    });

    $('studioForm').addEventListener('submit', async e => {
        e.preventDefault(); const f = $('studioForm'); clearErrors(f);
        const payload = { name: $('sName').value.trim(), address: $('sAddr').value.trim(), city: $('sCity').value.trim(), open_time: $('sOpen').value, close_time: $('sClose').value, phone: $('sPhone').value.trim() || null, description: $('sDesc').value.trim() || null };
        let bad = false;
        if (payload.name.length < 2) { setErr(f, 'name', 'Tên cơ sở tối thiểu 2 ký tự.', 'sName'); bad = true; }
        if (payload.address.length < 3) { setErr(f, 'address', 'Địa chỉ tối thiểu 3 ký tự.', 'sAddr'); bad = true; }
        if (payload.city.length < 2) { setErr(f, 'city', 'Nhập thành phố.', 'sCity'); bad = true; }
        if (!payload.open_time || !payload.close_time || payload.close_time <= payload.open_time) { setErr(f, 'hours', 'Giờ đóng cửa phải sau giờ mở cửa.', 'sClose'); bad = true; }
        if (bad) return;
        const btn = $('studioSave'); btn.disabled = true;
        try {
            const wasEdit = editingStudioId !== null;
            await P.data.saveStudio(editingStudioId, payload);
            S.close($('studioModal'));
            P.toast(wasEdit ? 'Đã cập nhật cơ sở.' : (P.currentUser() && P.currentUser().role === 'ADMIN' ? 'Đã thêm cơ sở mới.' : 'Đã gửi cơ sở mới, chờ admin duyệt.'), 'ok');
            await load();
        } catch (err) { P.toast('Lưu thất bại: ' + err.message, 'bad'); }
        finally { btn.disabled = false; }
    });

    $('studioList').addEventListener('click', async e => {
        const ed = e.target.closest('[data-sedit]'), del = e.target.closest('[data-sdel]');
        if (ed) openStudioForm(studios.find(s => s.studio_id === Number(ed.dataset.sedit)));
        if (del) {
            const st = studios.find(s => s.studio_id === Number(del.dataset.sdel));
            const n = rooms.filter(r => r.studio_id === st.studio_id).length;
            const warn = n ? `\nCơ sở có ${n} phòng — các phòng, thiết bị và gói dịch vụ của cơ sở cũng bị xóa.` : '';
            if (!confirm(`Xóa cơ sở "${st.name}"?${warn}\nThao tác này không thể hoàn tác.`)) return;
            del.disabled = true;
            try { await P.data.deleteStudio(st.studio_id); P.toast('Đã xóa cơ sở.', 'ok'); await load(); }
            catch (err) { del.disabled = false; P.toast(err.message, 'bad'); }
        }
    });
    $('roomList').addEventListener('click', async e => {
        const edit = e.target.closest('[data-edit]'), tog = e.target.closest('[data-toggle]');
        if (edit) openRoomForm(rooms.find(r => r.room_id === Number(edit.dataset.edit)));
        if (tog) {
            const room = rooms.find(r => r.room_id === Number(tog.dataset.toggle)), next = room.status === 'INACTIVE' ? 'AVAILABLE' : 'INACTIVE';
            if (next === 'INACTIVE' && !confirm('Ẩn phòng "' + room.name + '"? Khách sẽ không thấy phòng này để đặt.')) return;
            try { await P.data.setRoomStatus(room, next); P.toast(next === 'INACTIVE' ? 'Đã ẩn phòng.' : 'Đã hiện lại phòng.', 'ok'); await load(); }
            catch (err) { P.toast('Thao tác thất bại: ' + err.message, 'bad'); }
        }
    });
    await load();

})();
</script>
</body>
</html>
