<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Đánh giá &amp; Khiếu nại - Provider Hub</title>
    <link rel="stylesheet" href="../assets/css/provider-mobile.css">
</head>
<body class="m">
<div class="m-app">
    <header class="m-top" id="mTop"></header>
    <main class="m-main">
        <div class="alert bad" id="pageError" role="alert" hidden></div>
        <div class="tabs" id="mainTabs" role="tablist">
            <button class="tab active" data-tab="reviews" role="tab">⭐ Đánh giá<span class="count" id="cReviews">0</span></button>
            <button class="tab" data-tab="disputes" role="tab">⚠️ Khiếu nại<span class="count" id="cDisputes">0</span></button>
        </div>
        <section id="paneReviews" class="m-main" style="padding:0">
            <div class="card" id="ratingSummary"></div>
            <div class="m-list" id="reviewList"></div>
        </section>
        <section id="paneDisputes" class="m-main" style="padding:0" hidden>
            <div class="tabs" id="dTabs" role="tablist" aria-label="Lọc khiếu nại"></div>
            <div class="m-list" id="dList"></div>
        </section>
    </main>
</div>
<div class="modal-overlay" id="dModal" role="dialog" aria-modal="true" aria-labelledby="dmTitle">
    <form class="modal" id="dForm" novalidate>
        <div class="modal-head"><span id="dmTitle">Khiếu nại</span><button type="button" class="icon-btn" data-close aria-label="Đóng">✕</button></div>
        <dl class="kv" id="dmInfo"></dl>
        <div class="field" id="dmResWrap" style="margin-top:12px;">
            <label for="dmRes">Phản hồi / hướng giải quyết (khách sẽ thấy)</label>
            <textarea class="input" id="dmRes" rows="4" maxlength="4000" style="max-width:none"></textarea>
        </div>
        <div class="alert bad" id="dmErr" role="alert" hidden></div>
        <div class="modal-foot">
            <button type="button" class="btn btn-ghost" id="dmReview">Tiếp nhận</button>
            <button type="submit" class="btn btn-primary" id="dmResolve">Phản hồi &amp; đóng</button>
        </div>
    </form>
</div>
<nav class="m-nav" id="mNav" aria-label="Điều hướng chính"></nav>
<script src="../assets/js/provider-common.js"></script>
<script>
(async function () {
    const P = Provider, $ = id => document.getElementById(id);
    await P.mountMobile('profile', 'Đánh giá & Khiếu nại');
    const S = P.bindSheets();
    let reviews = [], disputes = [], dTab = 'ALL', cur = null;
    const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
    const dt = s => s ? P.fmtDate(s) + ' ' + P.fmtTime(s) : '—';
    const dBadge = st => { const x = P.DISPUTE_STATUS[st] || { label: st, cls: 'muted' }; return `<span class="badge ${x.cls}">${x.label}</span>`; };
    const isLive = st => ['OPEN', 'IN_REVIEW'].includes(st);

    function renderReviews() {
        $('cReviews').textContent = reviews.length;
        const avg = reviews.length ? reviews.reduce((s, r) => s + r.rating, 0) / reviews.length : null;
        $('ratingSummary').innerHTML = avg == null ? '<div class="empty">Chưa có đánh giá nào.</div>' :
            `<div style="text-align:center"><div style="font-size:2.2rem;font-weight:800">${avg.toFixed(1)}</div><div style="color:var(--warn);letter-spacing:2px">${stars(Math.round(avg))}</div><div class="muted small">${reviews.length} đánh giá</div></div>`;
        $('reviewList').innerHTML = reviews.map(r => `<div class="m-item">
            <div class="m-item-head"><div><strong>${P.esc(r.customer_name || 'Khách #' + r.customer_id)}</strong><span class="sub">${P.esc(r.studio_name || '')} • ${dt(r.created_at)}</span></div><span style="color:var(--warn)">${stars(r.rating)}</span></div>
            <div style="font-size:.85rem">${r.comment ? P.esc(r.comment) : '<i class="muted">(Không có nhận xét)</i>'}</div></div>`).join('');
    }
    function renderDisputes() {
        $('cDisputes').textContent = disputes.filter(d => isLive(d.status)).length;
        const keys = [['ALL', 'Tất cả'], ['OPEN', 'Mới'], ['IN_REVIEW', 'Đang xem xét'], ['RESOLVED', 'Đã giải quyết'], ['REJECTED', 'Bị bác bỏ']];
        $('dTabs').innerHTML = keys.map(([k, l]) => `<button class="tab${dTab === k ? ' active' : ''}" data-dtab="${k}">${l}</button>`).join('');
        $('dList').innerHTML = disputes.filter(d => dTab === 'ALL' || d.status === dTab).map(d => `<div class="m-item">
            <div class="m-item-head"><div><strong>#${d.dispute_id} • Đơn #${d.reservation_id}</strong><span class="sub">${P.esc(d.raised_by_name || '')} • ${dt(d.created_at)}</span></div>${dBadge(d.status)}</div>
            <div style="font-size:.85rem">${P.esc(d.reason)}</div>
            <button class="btn btn-ghost btn-sm" data-open="${d.dispute_id}">${isLive(d.status) ? 'Xử lý' : 'Xem'}</button></div>`).join('')
            || '<div class="empty">Không có khiếu nại nào.</div>';
    }
    $('dTabs').addEventListener('click', e => { const b = e.target.closest('[data-dtab]'); if (b) { dTab = b.dataset.dtab; renderDisputes(); } });
    $('mainTabs').addEventListener('click', e => {
        const b = e.target.closest('[data-tab]'); if (!b) return;
        document.querySelectorAll('#mainTabs .tab').forEach(t => t.classList.toggle('active', t === b));
        $('paneReviews').hidden = b.dataset.tab !== 'reviews'; $('paneDisputes').hidden = b.dataset.tab !== 'disputes';
    });
    $('dList').addEventListener('click', e => {
        const b = e.target.closest('[data-open]'); if (!b) return;
        const d = cur = disputes.find(x => x.dispute_id === Number(b.dataset.open));
        $('dmTitle').innerHTML = `Khiếu nại #${d.dispute_id} ${dBadge(d.status)}`;
        $('dmInfo').innerHTML = `<dt>Khách</dt><dd>${P.esc(d.raised_by_name || '')}</dd><dt>Đơn</dt><dd>#${d.reservation_id} • ${P.esc(d.room_name || '')}</dd><dt>Nội dung</dt><dd>${P.esc(d.reason)}</dd>${d.resolution && !isLive(d.status) ? `<dt>Phản hồi</dt><dd>${P.esc(d.resolution)}</dd>` : ''}`;
        $('dmResWrap').hidden = $('dmResolve').hidden = !isLive(d.status); $('dmReview').hidden = d.status !== 'OPEN';
        $('dmRes').value = d.resolution || ''; $('dmErr').hidden = true; S.open('dModal');
    });
    async function submit(status) {
        $('dmErr').hidden = true; const text = $('dmRes').value.trim();
        if (status === 'RESOLVED' && text.length < 3) { $('dmErr').hidden = false; $('dmErr').textContent = 'Hãy nhập nội dung phản hồi.'; return; }
        try {
            await P.data.updateDispute(cur.dispute_id, status, status === 'RESOLVED' ? text : null);
            P.toast(status === 'RESOLVED' ? 'Đã phản hồi và đóng khiếu nại.' : 'Đã tiếp nhận khiếu nại.', 'ok');
            $('dModal').classList.remove('open'); disputes = await P.data.disputes(); renderDisputes();
        } catch (err) { $('dmErr').hidden = false; $('dmErr').textContent = err.message; }
    }
    $('dmReview').onclick = () => submit('IN_REVIEW');
    $('dForm').addEventListener('submit', e => { e.preventDefault(); submit('RESOLVED'); });
    try { [reviews, disputes] = await Promise.all([P.data.reviews(), P.data.disputes()]); renderReviews(); renderDisputes(); }
    catch (err) { const b = $('pageError'); b.hidden = false; b.textContent = err.message; }
})();
</script>
</body>
</html>
