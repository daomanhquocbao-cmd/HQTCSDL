<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tổng quan - Provider Hub</title>
    <link rel="stylesheet" href="../assets/css/provider-mobile.css">
</head>
<body class="m">
<div class="m-app">
    <header class="m-top" id="mTop"></header>
    <main class="m-main">
        <div class="alert bad" id="pageError" role="alert" hidden></div>

        <section class="m-kpis" aria-label="Chỉ số chính">
            <div class="card kpi banner"><span class="kpi-label" id="revLabel">Doanh thu tháng này</span><span class="kpi-value" id="kpiRevenue">—</span><span class="kpi-sub" id="kpiRevenueSub">&nbsp;</span></div>
            <div class="card kpi"><span class="kpi-label">Phòng / Studio</span><span class="kpi-value" id="kpiRooms">—</span><span class="kpi-sub" id="kpiRoomsSub">&nbsp;</span></div>
            <div class="card kpi"><span class="kpi-label">Chờ duyệt</span><span class="kpi-value" id="kpiPending">—</span><span class="kpi-sub" id="kpiPendingSub">&nbsp;</span></div>
            <div class="card kpi" style="grid-column:1/-1"><span class="kpi-label">Đánh giá trung bình</span><span class="kpi-value" id="kpiRating">—</span><span class="kpi-sub" id="kpiRatingSub">&nbsp;</span></div>
        </section>
        <section class="card">
            <div class="card-head"><span class="card-title">Tiện ích khác</span></div>
            <div class="m-list">
                <a class="m-item" href="provider-feedback.html" style="text-decoration:none;color:inherit"><div class="m-item-head"><strong>💬 Đánh giá &amp; Khiếu nại</strong><span>›</span></div></a>
                <a class="m-item" href="provider-workshops.html" style="text-decoration:none;color:inherit"><div class="m-item-head"><strong>🎓 Workshop tại cơ sở</strong><span>›</span></div></a>
            </div>
        </section>
        <section class="card">
            <div class="card-head"><span class="card-title">📈 Doanh thu 6 tháng</span><span class="badge ok" id="revDelta" hidden></span></div>
            <div class="chart" id="chart" role="img" aria-label="Biểu đồ cột doanh thu theo tháng" style="gap:10px;height:170px"></div>
            <div class="chart-labels" id="chartLabels" style="gap:10px"></div>
        </section>
        <section class="card">
            <div class="card-head"><span class="card-title">Yêu cầu đặt lịch gần đây</span><a class="btn btn-ghost btn-sm" href="provider-bookings.html">Duyệt →</a></div>
            <div id="recent"></div>
        </section>
        <section class="card">
            <div class="card-head"><span class="card-title">🏆 Phòng hiệu quả nhất</span></div>
            <div id="topRooms"></div>
        </section>
        <section class="card">
            <div class="card-head"><span class="card-title">Phòng đang vận hành</span><a class="btn btn-ghost btn-sm" href="provider-rooms.html">Tất cả →</a></div>
            <div id="roomList"></div>
        </section>
    </main>
</div>
<nav class="m-nav" id="mNav" aria-label="Điều hướng chính"></nav>
<script src="../assets/js/provider-common.js"></script>
<script>
(async function () {
    const P = Provider, $ = id => document.getElementById(id);
    await P.mountMobile('dashboard', 'Tổng quan');
    try {
        const [ov, rooms, bookings] = await Promise.all([P.data.overview(), P.data.rooms(), P.data.bookings()]);
        P.refreshChrome();
        const activeRooms = rooms.filter(r => r.status === 'AVAILABLE');
        const roomName = id => (rooms.find(r => r.room_id === id) || {}).name || ('Phòng #' + id);
        const custName = b => b.customer_name || b.customer || ('Khách #' + b.customer_id);

        const now = new Date();
        const months = (ov.revenue_by_month || []).map(m => ({ label: 'T' + Number(String(m.month).slice(-2)), value: m.revenue }));
        if (!months.length) months.push({ label: 'T' + (now.getMonth() + 1), value: 0 });
        const cur = ov.revenue_this_month, prev = months.length > 1 ? months[months.length - 2].value : 0;
        $('revLabel').textContent = 'Doanh thu tháng ' + (now.getMonth() + 1) + '/' + now.getFullYear();
        $('kpiRevenue').textContent = P.money(cur);
        $('kpiRevenueSub').textContent = 'Tổng cộng: ' + P.money(ov.revenue_total);
        if (prev > 0) {
            const pct = Math.round((cur - prev) / prev * 100);
            $('kpiRevenueSub').textContent = (pct >= 0 ? '▲ Tăng ' : '▼ Giảm ') + Math.abs(pct) + '% so với tháng trước';
            const d = $('revDelta'); d.hidden = false; d.textContent = (pct >= 0 ? '▲ +' : '▼ ') + pct + '%'; d.className = 'badge ' + (pct >= 0 ? 'ok' : 'bad');
        }
        const max = Math.max(...months.map(m => m.value), 1);
        $('chart').innerHTML = months.map((m, i) => `<div class="chart-col${i === months.length - 1 ? ' last' : ''}"><span class="chart-val">${P.moneyShort(m.value)}</span><div class="chart-bar" style="height:${Math.max(2, m.value / max * 100)}%"></div></div>`).join('');
        $('chartLabels').innerHTML = months.map(m => `<span>${P.esc(m.label)}</span>`).join('');

        $('kpiRooms').textContent = activeRooms.length;
        $('kpiRoomsSub').textContent = ov.studio_count + ' cơ sở • ' + ov.equipment_count + ' thiết bị';
        $('kpiPending').textContent = ov.pending_bookings;
        $('kpiPendingSub').textContent = ov.pending_bookings ? 'Cần xử lý sớm' : 'Không có yêu cầu chờ';
        if (ov.avg_rating != null) { $('kpiRating').textContent = '⭐ ' + Number(ov.avg_rating).toFixed(1); $('kpiRatingSub').textContent = ov.review_count + ' đánh giá'; }
        else { $('kpiRating').textContent = '—'; $('kpiRatingSub').textContent = 'Chưa có đánh giá'; }

        const ranked = ov.top_rooms || [], totalRev = ranked.reduce((s, r) => s + r.revenue, 0) || 1;
        const colors = ['var(--ok)', 'var(--primary-color)', 'var(--warn)', '#a855f7', '#ec4899'];
        $('topRooms').innerHTML = ranked.length ? ranked.map((r, i) => `<div class="stat-row"><div><strong>${i + 1}. ${P.esc(r.room_name)}</strong><span>${P.moneyShort(r.revenue)} • ${r.bookings} lượt</span></div><div class="progress"><div style="width:${Math.round(r.revenue / totalRev * 100)}%;background:${colors[i % colors.length]}"></div></div></div>`).join('') : '<div class="empty">Chưa có lượt đặt nào.</div>';

        $('recent').innerHTML = bookings.filter(b => b.status === 'PENDING').slice(0, 5).map(b => `
            <div class="list-item"><div><strong>${P.esc(custName(b))} — ${P.esc(roomName(b.room_id))}</strong><span class="muted small">${P.fmtRange(b.start_time, b.end_time)}</span></div><span class="badge warn">Chờ duyệt</span></div>`).join('') || '<div class="empty">Không có yêu cầu nào đang chờ duyệt.</div>';
        $('roomList').innerHTML = activeRooms.slice(0, 6).map(r => `
            <div class="list-item"><div><strong>${P.esc(r.name)}</strong><span class="muted small">${P.esc(P.ROOM_TYPES[r.room_type] || r.room_type)} • ${P.money(r.price_per_hour)}/giờ</span></div><span class="badge ok">● Hoạt động</span></div>`).join('') || '<div class="empty">Chưa có phòng nào. <a href="provider-rooms.html">Thêm phòng</a></div>';
    } catch (err) { const b = $('pageError'); b.hidden = false; b.textContent = 'Không tải được dữ liệu: ' + err.message; }

})();
</script>
</body>
</html>
